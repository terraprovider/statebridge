version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "github.com/terraprovider/statebridge/cmd.Tag={{.RawVersion}}" -X "github.com/terraprovider/statebridge/cmd.Commit={{.ShortCommit}}" -X "github.com/terraprovider/statebridge/cmd.BuildDate={{.Date}}"
    flags:
      - -trimpath
      - "-mod=readonly"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    artifacts: all
    signature: "${artifact}.sigstore.json"
    args: [ "sign-blob", "--bundle=${signature}", "${artifact}", "--yes" ]

sboms:
  - id: default
    disable: false

release:
  prerelease: "true"
