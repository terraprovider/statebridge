name: E2E Fast Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'go.mod'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  checks: write

env:
  ARM_USE_OIDC: "true"

jobs:
  e2e_fast:
    runs-on: ubuntu-latest-8cpu
    environment: e2e

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run fast e2e tests
        env:
          ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
          E2E_STORAGE_ACCOUNT_NAME: ${{ vars.E2E_STORAGE_ACCOUNT_NAME }}
        run: |
          gotestsum --junitfile test-results.xml --format standard-verbose -- -tags=e2e_fast -timeout=10m -count=1 ./e2e/...

      - name: Test Summary
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: test-results.xml
        if: always()
