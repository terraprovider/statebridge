name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Azure region'
        default: 'westeurope'
  pull_request:
    branches: [main]
    paths:
      - 'pkg/**'
      - 'cmd/**'
      - 'e2e/**'
      - 'go.mod'

permissions:
  id-token: write
  contents: read
  issues: read
  checks: write
  pull-requests: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  E2E_STORAGE_ACCOUNT_NAME: ${{ vars.E2E_STORAGE_ACCOUNT_NAME }}
  E2E_LOCATION: ${{ github.event.inputs.location || 'westeurope' }}

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-go-test
        with:
          setup-tofu: "true"
          test-args: -tags=e2e -timeout=60m -count=1 ./e2e/...
          gotestsum-format: standard-verbose
          check-name: E2E Test Results
